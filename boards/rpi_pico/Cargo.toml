[package]
name = "rust-dap-raspberrypi-pico"
version = "0.2.0"
authors = ["Kenta IDA <fuga@fugafuga.org>"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "rust-dap/defmt",
]
default = ["swd"]
bitbang = ["rust-dap-rp/bitbang"]
set_clock = [
    "rust-dap-rp/set_clock",
] # Enable swj_clock implementation for PIO and set appropriate SWD/JTAG frequency. Without it, SWD uses SWCLK = system_clock / 8 and JTAG uses TCK = system_clock / 8
jtag = []
swd = []
swj = ["bitbang"] # Combined SWD+JTAG with runtime DAP_Connect switching (bit-banging)
ram-exec = ["rust-dap-rp/ram-exec"] # Execute-in-SRAM support

# --- Standalone GDB server (RSP over USB-CDC) ------------------------------
# Stub core: gdbstub + the arm-debug ADIv5/Cortex-M stack. Target-chip
# support is selected with one or more gdb-target-* features.
gdbserver = ["dep:gdbstub", "dep:gdbstub_arch", "dep:arm-debug", "dep:gdb-server-core"]
# RP2040 targets: SWD multidrop connect, dual-core threads, bootrom flashing.
gdb-target-rp2040 = ["gdbserver", "gdb-server-core?/gdb-target-rp2040"]
# nRF52 targets: SW-DP connect, single core, NVMC flashing, CTRL-AP recovery.
gdb-target-nrf52 = ["gdbserver", "gdb-server-core?/gdb-target-nrf52"]
# nRF54L targets: DPv2 SW-DP, Cortex-M33, RRAM flashing, CTRL-AP #2.
gdb-target-nrf54 = ["gdbserver", "gdb-server-core?/gdb-target-nrf54"]
# Auto-detect the target family (by DPIDR) among the enabled gdb-target-*
# features, so one build debugs whichever single target is wired. Combine
# with the families to include, e.g.
#   --features gdb-target-auto,gdb-target-rp2040,gdb-target-nrf52
gdb-target-auto = ["gdbserver", "gdb-server-core?/gdb-target-auto"]
# Add a third CDC port to gdb_server that bridges the target UART (GPIO0=TX,
# GPIO1=RX) to the host, fixed at 115200 8N1. Off by default to keep the lean
# RSP+RTT build (and its USB endpoint budget) unchanged.
uart-bridge = ["dep:embedded-hal-nb"]
# arm-debug hardware self-test firmware (m1_selftest).
selftest = ["dep:arm-debug"]

# gdb_server / m1_selftest are feature-gated so plain CMSIS-DAP probe builds
# don't pull in the debugger stack. blink_demo (a demo payload for the GDB
# debugger's target) has no extra dependencies and stays ungated.
[[bin]]
name = "gdb_server"
path = "src/bin/gdb_server.rs"
# One target family must be selected (mutually exclusive). The default build
# picks RP2040; nRF52 needs --no-default-features --features gdb-target-nrf52.
required-features = ["gdbserver"]

[[bin]]
name = "m1_selftest"
path = "src/bin/m1_selftest.rs"
required-features = ["selftest"]

[[bin]]
name = "nrf52_probe"
path = "src/bin/nrf52_probe.rs"
required-features = ["selftest"]

[dependencies.rp2040-hal]
version = "0.12"
features = ["rt", "critical-section-impl"]

[dependencies.rust-dap-rp]
path = "../../rust-dap-rp"
default-features = false
features = ["rp2040"]

[dependencies]
rust-dap = { path = "../../rust-dap" }
arm-debug = { path = "../../arm-debug", optional = true }
gdb-server-core = { path = "../../gdb-server-core", optional = true }
gdbstub = { version = "0.7", default-features = false, optional = true }
gdbstub_arch = { version = "0.3", optional = true }
panic-halt = "0.2"
cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"
rp2040-boot2 = "0.2"
rtic = { version = "2", features = ["thumbv6-backend"] }
# thumbv6m has no atomic CAS; RTIC 2 relies on portable-atomic emulating it
# through the critical-section implementation provided by rp2040-hal.
portable-atomic = { version = "1", features = ["critical-section"] }

usb-device = { version = "0.3", features = ["control-buffer-256"] }
usbd-serial = "0.2"
nb = "0.1"
heapless = "0.7"
embedded-hal = "1.0"
embedded-hal-nb = { version = "1.0", optional = true }
defmt = { version = "0.3", optional = true }
defmt-rtt = { version = "0.4", optional = true }
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }
rtt-target = "0.5"
