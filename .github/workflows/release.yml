name: Release

# Push a version tag (e.g. `v1.2.3`) to build every firmware and attach the
# ELF/UF2 artifacts to a GitHub Release. The tag name is embedded into the
# firmware (DAP_Info 0x09 Product Firmware Version) via RUST_DAP_VERSION.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Dabao Board: the firmware is a Xous app in the ciniml/xous-core fork that
  # consumes this repo's crates by relative path (see boards/dabao/README.md).
  # Built in its own job (needs the Xous toolkit) and merged into the release.
  dabao:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-dap
      - uses: actions/checkout@v4
        with:
          repository: ciniml/xous-core
          ref: dabao-gdb-server
          path: xous-core
          fetch-depth: 0
      - name: install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
          rustup default ${RUST_TOOLCHAIN}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xous-core
      - name: build
        run: ./boards/dabao/build.sh --no-clone --xous-core ../xous-core
        working-directory: rust-dap
      - uses: actions/upload-artifact@v4
        with:
          name: dabao-firmware
          path: rust-dap/boards/dabao/dist/*
          if-no-files-found: error

  release:
    needs: dabao
    runs-on: ubuntu-latest
    container:
      image: rust:1.90-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: install build dependencies
        run: |
          apt-get update && apt-get -y install git
          rustup target add thumbv6m-none-eabi
          rustup target add thumbv8m.main-none-eabihf
          # --no-default-features drops elf2uf2-rs's auto-deploy feature, whose
          # libudev-sys dependency needs pkg-config + libudev (absent in the
          # slim container). The ELF->UF2 conversion itself needs neither.
          cargo install elf2uf2-rs --version 2.2.0 --locked --no-default-features --force
      - name: build firmwares
        env:
          # Reported by the firmware via DAP_Info(0x09); the container checkout
          # may lack a .git dir, so pass the tag explicitly.
          RUST_DAP_VERSION: ${{ github.ref_name }}
        run: |
          (cd boards/rpi_pico && cargo build --release --bin rust-dap-raspberrypi-pico)
          (cd boards/rpi_pico2 && cargo build --release --features swd)
          (cd boards/rpi_pico && cargo build --release --bin gdb_server \
             --features gdb-target-auto,gdb-target-rp2040,gdb-target-nrf52,gdb-target-nrf54)
          (cd boards/xiao_rp2040 && cargo build --release)
          (cd boards/xiao_m0 && cargo build --release)
      - uses: actions/download-artifact@v4
        with:
          name: dabao-firmware
          path: dabao
      - name: package artifacts
        run: |
          set -eu
          mkdir -p dist
          T=target/thumbv6m-none-eabi/release
          T235=target/thumbv8m.main-none-eabihf/release
          V=${GITHUB_REF_NAME}
          # RP2040 boards: ELF (debug/flash-via-probe) + UF2 (drag-and-drop).
          cp "$T/rust-dap-raspberrypi-pico" "dist/rust-dap-cmsis-dap-rpi-pico-$V.elf"
          elf2uf2-rs "$T/rust-dap-raspberrypi-pico" "dist/rust-dap-cmsis-dap-rpi-pico-$V.uf2"
          # RP2350/Pico 2: elf2uf2-rs 2.2.0 supports thumbv8m.main-none-eabihf.
          cp "$T235/rust-dap-raspberrypi-pico2" "dist/rust-dap-cmsis-dap-rpi-pico2-$V.elf"
          elf2uf2-rs "$T235/rust-dap-raspberrypi-pico2" "dist/rust-dap-cmsis-dap-rpi-pico2-$V.uf2"
          cp "$T/gdb_server" "dist/rust-dap-gdb-server-rpi-pico-$V.elf"
          elf2uf2-rs "$T/gdb_server" "dist/rust-dap-gdb-server-rpi-pico-$V.uf2"
          cp "$T/rust-dap-xiao-rp2040" "dist/rust-dap-cmsis-dap-xiao-rp2040-$V.elf"
          elf2uf2-rs "$T/rust-dap-xiao-rp2040" "dist/rust-dap-cmsis-dap-xiao-rp2040-$V.uf2"
          # SAMD21 (xiao_m0): ELF only — UF2 uses a different family id.
          cp "$T/rust-dap-xiao" "dist/rust-dap-cmsis-dap-xiao-m0-$V.elf"
          # Dabao Board (built by the `dabao` job): loader/xous/apps UF2 set + app ELF.
          for f in loader xous apps; do
            cp "dabao/$f.uf2" "dist/rust-dap-gdb-server-dabao-$V-$f.uf2"
          done
          cp dabao/dabao-gdb "dist/rust-dap-gdb-server-dabao-$V.elf"
          ls -la dist
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
